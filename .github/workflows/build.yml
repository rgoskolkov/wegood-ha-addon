name: Validate WeGoodCharge integration
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Test native integration runtime
        run: python -m unittest discover -s native_tests -v
      - name: Install validation dependencies
        run: python -m pip install "homeassistant==2026.11.0" "paho-mqtt==2.1.0" "ruff==0.17.3"
      - name: Lint native integration
        run: ruff check custom_components/wegood_charge native_tests
      - name: Smoke-test Home Assistant imports
        run: |
          python - <<'PY'
          import importlib
          modules = (
              "custom_components.wegood_charge",
              "custom_components.wegood_charge.binary_sensor",
              "custom_components.wegood_charge.config_flow",
              "custom_components.wegood_charge.hub",
              "custom_components.wegood_charge.number",
              "custom_components.wegood_charge.select",
              "custom_components.wegood_charge.sensor",
              "custom_components.wegood_charge.switch",
          )
          for module in modules:
              importlib.import_module(module)
          PY
      - name: Validate Marketplace/HACS integration sources
        run: |
          python -m compileall -q custom_components/wegood_charge
          node --check custom_components/wegood_charge/frontend/wegood-charge-card.js
          test -f custom_components/wegood_charge/brand/icon.png
          test -f custom_components/wegood_charge/brand/logo.png
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path("hacs.json"), *Path("custom_components/wegood_charge").rglob("*.json")]:
              json.loads(path.read_text(encoding="utf-8"))
          PY
      - name: Check whitespace
        run: git show --check --format= HEAD

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="release_notes/${version}.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          elif [ -f "$notes_file" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "WeGoodCharge $version" \
              --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "WeGoodCharge $version" \
              --generate-notes
          fi
